[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negpilot"
version = "0.1.0"
description = "Logic-verified synthetic negation reasoning dataset"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.12",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
negpilot = "negpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
